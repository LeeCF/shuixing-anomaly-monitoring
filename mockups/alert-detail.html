<head>
<meta charset="utf-8">

<title>重复付款告警 · 异常交易实时监测</title>
<style>
  :root{
    --brand:#0070f2; --brand-active:#0064d9; --brand-light:#ebf5ff;
    --bg:#f5f6f7; --surface:#fff;
    --line:#d9d9d9; --line-soft:#eaecee; --line-faint:#f0f1f2;
    --tx:#1d2d3f; --tx2:#556b81; --tx3:#6a7a8c;
    --neg:#d20a0a; --neg-bg:#ffeaea; --neg-soft:#fff3f3;
    --crit:#e76500; --crit-bg:#fff4e6;
    --pos:#107e3e; --pos-bg:#e6f3ea;
    --info:#0070f2; --neutral:#5b738b;
    --rule:#0070f2; --stat:#7858ff; --prof:#e76500;
    --shell:48px; --nav:224px; --radius:12px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{font-family:"72","72override",-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--tx);font-size:14px;line-height:1.4;}
  a{color:var(--brand);text-decoration:none;}

  /* Shell */
  .shell{position:fixed;inset:0 0 auto 0;height:var(--shell);background:#fff;
    border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:16px;padding:0 16px;z-index:40;}
  .shell .sap{font-weight:800;font-size:15px;color:#0a6ed1;letter-spacing:.5px;}
  .shell .app{font-size:15px;font-weight:600;}
  .shell .sp{flex:1;}
  .shell .act{position:relative;height:32px;min-width:32px;padding:0 8px;border-radius:16px;display:flex;
    align-items:center;justify-content:center;gap:6px;color:var(--tx2);cursor:pointer;font-size:16px;}
  .shell .act:hover{background:var(--line-faint);}
  .shell .act .lbl{font-size:13px;font-weight:600;}
  .shell .act .bdg{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:var(--neg);
    color:#fff;font-size:10px;font-weight:700;border-radius:8px;display:flex;align-items:center;
    justify-content:center;padding:0 4px;border:2px solid #fff;}
  .shell .me{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* Side nav */
  .side{position:fixed;top:var(--shell);bottom:0;left:0;width:var(--nav);background:#fff;
    border-right:1px solid var(--line-soft);padding:10px 8px;overflow:auto;z-index:30;}
  .side .grp{font-size:11px;font-weight:700;color:var(--tx3);padding:12px 12px 6px;}
  .side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--tx);
    font-size:14px;margin-bottom:1px;position:relative;}
  .side a .ic{width:18px;text-align:center;color:var(--tx2);font-size:15px;}
  .side a:hover{background:var(--line-faint);}
  .side a.on{background:var(--brand-light);color:var(--brand);font-weight:600;}
  .side a.on .ic{color:var(--brand);}
  .side a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--brand);border-radius:0 2px 2px 0;}

  .page{margin:var(--shell) 0 0 var(--nav);min-height:calc(100vh - var(--shell));display:flex;flex-direction:column;}

  /* Dynamic page header with Horizon gradient */
  .dph{position:relative;background:
      radial-gradient(1200px 300px at 100% -40%, #d6e8ff 0%, rgba(214,232,255,0) 60%),
      linear-gradient(180deg,#fbfdff 0%,#ffffff 70%);
    border-bottom:1px solid var(--line-soft);padding:14px 32px 0;overflow:hidden;}
  .dph::after{content:"";position:absolute;right:-60px;top:-40px;width:360px;height:220px;
    background:radial-gradient(closest-side,rgba(0,112,242,.10),rgba(0,112,242,0));pointer-events:none;}
  .crumb{font-size:12.5px;color:var(--tx2);margin-bottom:10px;position:relative;}
  .crumb a:hover{text-decoration:underline;}
  .dph-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;}
  .dph-title h1{font-size:22px;font-weight:700;letter-spacing:-.2px;}
  .ostat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:14px;}
  .ostat .d{width:8px;height:8px;border-radius:50%;}
  .ostat.neg{background:var(--neg-bg);color:var(--neg);} .ostat.neg .d{background:var(--neg);}
  .dph-sub{font-size:12.5px;color:var(--tx2);margin-top:5px;position:relative;}
  .dph-body{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:16px 0 18px;align-items:center;position:relative;}
  .mstrip{display:flex;gap:12px;align-items:flex-start;background:var(--neg-soft);border:1px solid #ffd4d4;
    border-radius:10px;padding:13px 15px;}
  .mstrip .mi{color:var(--neg);font-size:18px;}
  .mstrip .mt{font-size:15px;font-weight:600;}
  .mstrip .ms{font-size:13px;color:var(--tx2);margin-top:3px;line-height:1.5;}
  .kpis{display:flex;align-items:center;gap:18px;justify-content:flex-end;}
  .gauge{position:relative;width:96px;height:96px;flex:none;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge .c b{font-size:28px;font-weight:800;color:var(--neg);line-height:1;}
  .gauge .c small{font-size:10.5px;color:var(--tx3);margin-top:2px;}
  .kfacts{display:flex;flex-direction:column;gap:11px;}
  .kfact .l{font-size:11.5px;color:var(--tx3);}
  .kfact .v{font-size:16px;font-weight:700;}
  .kfact .v.neg{color:var(--neg);}

  .anchors{position:sticky;top:var(--shell);background:#fff;border-bottom:1px solid var(--line-soft);
    padding:0 32px;display:flex;gap:4px;z-index:20;}
  .anchors a{padding:11px 14px;font-size:14px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;}
  .anchors a:hover{color:var(--tx);}
  .anchors a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}

  /* content: main + right rail */
  .content{padding:20px 32px 96px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);
    gap:16px;align-items:start;flex:1;}
  .colL,.colR{display:flex;flex-direction:column;gap:16px;}
  .sect{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;}
  .sect>h2{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .sect>h2 .ix{font-size:13px;color:var(--tx3);font-weight:600;}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px;}
  .kv .k{color:var(--tx3);white-space:nowrap;}
  .kv .hl{color:var(--neg);font-weight:700;}

  .layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
  .lt{border:1px solid var(--line-soft);border-radius:10px;padding:14px;}
  .lt .h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:9px;}
  .lt .h .d{width:9px;height:9px;border-radius:50%;}
  .lt.rule{background:#f3f8ff;} .lt.rule .h{color:var(--rule);} .lt.rule .d{background:var(--rule);}
  .lt.stat{background:#f7f5ff;} .lt.stat .h{color:var(--stat);} .lt.stat .d{background:var(--stat);}
  .lt.prof{background:#fff7f0;} .lt.prof .h{color:var(--prof);} .lt.prof .d{background:var(--prof);}
  .lt .b{font-size:13.5px;line-height:1.5;}
  .lt .big{font-size:24px;font-weight:800;margin:3px 0;}
  .lt .big small{font-size:12px;font-weight:400;color:var(--tx3);}
  .ii{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
    border:1px solid currentColor;font-size:10px;font-style:normal;cursor:pointer;opacity:.65;vertical-align:middle;}
  .ii:hover{opacity:1;}
  .evid{margin-top:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;}
  .evid:hover{text-decoration:underline;}

  .case{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line-faint);font-size:13.5px;}
  .case:last-child{border:none;}
  .case .tg{font-size:11.5px;color:var(--tx2);background:var(--line-faint);border-radius:5px;padding:3px 8px;white-space:nowrap;}
  .case .oc{font-size:11.5px;font-weight:600;border-radius:5px;padding:3px 8px;white-space:nowrap;}
  .oc.bad{background:var(--neg-bg);color:var(--neg);} .oc.ok{background:var(--pos-bg);color:var(--pos);}

  .act{display:grid;grid-template-columns:88px 1fr;gap:13px;align-items:start;padding:11px 0;
    border-bottom:1px solid var(--line-faint);font-size:13.5px;line-height:1.5;}
  .act:last-child{border:none;}
  .u{text-align:center;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:5px 0;}
  .u.now{background:var(--neg);} .u.h24{background:var(--crit);} .u.opt{background:var(--neutral);}

  /* vendor profile */
  .vp{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;}
  .vp .k{color:var(--tx3);white-space:nowrap;}
  .spark{margin-top:14px;}
  .spark .cap{font-size:11.5px;color:var(--tx3);margin-bottom:6px;display:flex;justify-content:space-between;}

  .tl{position:relative;padding-left:24px;}
  .tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);}
  .tl .n{position:relative;padding:4px 0 16px;}
  .tl .n:last-child{padding-bottom:0;}
  .tl .n::before{content:"";position:absolute;left:-20px;top:6px;width:11px;height:11px;border-radius:50%;
    background:#fff;border:2px solid var(--brand);}
  .tl .n.done::before{background:var(--brand);}
  .tl .n.wait::before{border-color:var(--tx3);border-style:dashed;}
  .tl .n .tt{font-size:12px;color:var(--tx3);}
  .tl .n .dd{font-size:14px;font-weight:600;margin:1px 0;}
  .tl .n .nn{font-size:12.5px;color:var(--tx2);}

  .foot{position:fixed;left:var(--nav);right:0;bottom:0;background:#fff;border-top:1px solid var(--line-soft);
    padding:12px 32px;display:flex;align-items:center;gap:12px;z-index:25;box-shadow:0 -1px 6px rgba(0,0,0,.04);}
  .foot .q{font-size:13px;color:var(--tx2);margin-right:auto;}
  .btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:9px 20px;cursor:pointer;border:1px solid transparent;}
  .btn.emph{background:var(--neg);color:#fff;} .btn.emph:hover{background:#b00909;}
  .btn.tr{background:#fff;color:var(--crit);border-color:var(--crit);} .btn.tr:hover{background:var(--crit-bg);}
  .btn.gh{background:#fff;color:var(--tx2);border-color:var(--line);} .btn.gh:hover{background:var(--line-faint);}

  .pop{position:fixed;z-index:60;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.16);padding:14px 16px;display:none;}
  .pop.show{display:block;}
  .pop h4{font-size:12.5px;color:var(--brand);margin-bottom:8px;}
  .pop code{display:block;background:var(--bg);border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.6;margin-bottom:8px;}
  .pop p{font-size:12.5px;color:var(--tx2);line-height:1.55;}

  .mask{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:70;display:none;align-items:center;justify-content:center;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:620px;max-width:92vw;max-height:84vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.28);}
  .modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-soft);}
  .modal .mh b{font-size:15px;} .modal .mh .x{margin-left:auto;cursor:pointer;color:var(--tx3);font-size:22px;}
  .modal .mb{padding:18px 20px;} .modal .mb p{font-size:13.5px;color:var(--tx2);line-height:1.55;}
  table.ev{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0;}
  table.ev th{background:var(--bg);text-align:left;padding:10px 11px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line-soft);}
  table.ev td{padding:10px 11px;border-bottom:1px solid var(--line-faint);}
  table.ev tr.dup td{background:var(--neg-soft);}
  .xh{color:var(--neg);font-weight:700;}

  @media(max-width:1080px){.dph-body{grid-template-columns:1fr;}.kpis{justify-content:flex-start;}.content{grid-template-columns:1fr;}}
</style>
</head>
